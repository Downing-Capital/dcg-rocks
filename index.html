<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DCG Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E253E'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23FFB290'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#F3F5F8;--surf:#FFFFFF;--surf2:#EDF1F6;--surf3:#E2E8EF;
  --bdr:#E1E6EC;--bdr2:#C0D0DC;
  --tx:#1E253E;--tx2:#5C6678;--tx3:#9AA3B2;
  --navy:#1E253E;--navy-bg:#E7ECF4;--sb:#1E253E;--sb-tx:#C4CEDF;--sb-tx2:#8893A8;
  --accent:#FFB290;--accent-bg:#FFF0E8;--accent-deep:#E8855A;
  --lblue:#9BC3E1;--steel:#C0D0DC;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --blue:#337EEF;--blue-bg:#E9F1FE;--blue-tx:#1E5AC0;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-tx:#27500A;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-tx:#633806;
  --red:#A32D2D;--red-bg:#FCEBEB;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-tx:#3C3489;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-tx:#085041;
  --r:8px;--rlg:12px;
  --font:'DM Sans',system-ui,sans-serif;--mono:'DM Mono',monospace;
  --shadow:0 1px 2px rgba(20,18,14,.04),0 2px 8px rgba(20,18,14,.05);
  --shadow-lg:0 4px 24px rgba(20,18,14,.10);
  --sb-w:236px;
}
[data-theme="dark"]{
  --bg:#16161A;--surf:#1F1F25;--surf2:#26262E;--surf3:#30303A;
  --bdr:#33333D;--bdr2:#45454F;
  --tx:#ECEBE8;--tx2:#A3A19C;--tx3:#6E6C68;
  --navy:#9BC3E1;--navy-bg:#232C3D;--sb:#161B2C;--sb-tx:#C4CEDF;--sb-tx2:#7E89A0;
  --accent:#FFB290;--accent-bg:#33271F;--accent-deep:#FFB290;
  --lblue:#9BC3E1;--steel:#C0D0DC;--serif:'Fraunces',Georgia,serif;
  --blue:#5B9BE0;--blue-bg:#1B2D40;--blue-tx:#9CC4EE;
  --green:#7FB04A;--green-bg:#1F2D16;--green-tx:#A6D178;
  --amber:#D49A4B;--amber-bg:#352713;--amber-tx:#E6BC7E;
  --red:#D86A6A;--red-bg:#3A1E1E;
  --purple:#9B92E8;--purple-bg:#262348;--purple-tx:#B7AFF2;
  --teal:#4FB89A;--teal-bg:#13332B;--teal-tx:#7FD4BC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.3);
  --shadow-lg:0 4px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;color:var(--tx);background:var(--bg);line-height:1.45;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx)}

/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sb-w);flex:0 0 var(--sb-w);background:var(--sb);border-right:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;transition:margin .2s}
.sidebar>*{min-width:0}
.brand{padding:20px 18px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#1E253E;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.brand-logo{height:26px;width:auto;max-width:180px;display:block}
.brand-row{display:flex;align-items:center;gap:10px}
.brand-mark{width:24px;height:24px;display:inline-flex;flex:0 0 auto}
.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.brand .bname{font-family:var(--serif);font-weight:600;font-size:17px;color:#fff;letter-spacing:-.01em;line-height:1.1}
.brand .btag{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--sb-tx2);font-weight:600}
.brand .bq{font-size:11px;color:var(--sb-tx2);font-family:var(--mono)}
.bq-sel{margin-top:2px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:var(--sb-tx);font-family:var(--mono);font-size:11px;border-radius:6px;padding:3px 7px;max-width:170px;cursor:pointer}
.bq-sel:hover{border-color:rgba(255,255,255,.28);color:#fff}
.bq-sel:focus{outline:none;border-color:var(--accent)}
.bq-sel option{color:#1E253E}
.nav{flex:1;padding:6px 10px 14px}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--sb-tx2);font-weight:600;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px 7px 14px;border-radius:var(--r);color:var(--sb-tx);
  text-decoration:none;font-size:13px;font-weight:500;margin:1px 0;transition:background .12s,color .12s;position:relative}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:rgba(255,255,255,.10);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;left:4px;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)}
.nav a svg{width:16px;height:16px;flex:0 0 auto;opacity:.8}
.nav a.on svg{opacity:1}
.nav a .badge{margin-left:auto;font-size:10px;font-family:var(--mono);background:rgba(255,255,255,.12);color:var(--sb-tx);
  padding:1px 6px;border-radius:20px;min-width:18px;text-align:center}
.nav a.on .badge{background:var(--accent);color:#1E253E}
.sb-foot{padding:10px;border-top:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-foot button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--sb-tx);border-radius:var(--r);
  padding:7px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:500}
.sb-foot button:hover{background:rgba(255,255,255,.14);color:#fff}
.sb-foot button svg{width:15px;height:15px;flex:0 0 auto}
.colrz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:2}
.colrz:hover,.col-resizing .colrz{background:linear-gradient(90deg,transparent 3px,var(--blue,#3b82f6) 3px,var(--blue,#3b82f6) 5px,transparent 5px)}
.col-resizing{cursor:col-resize !important;user-select:none}
.sb-foot button{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--bdr);padding:13px 26px;display:flex;align-items:center;gap:16px}
.topbar .titlewrap{min-width:0}
.topbar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.topbar .sub{font-size:12.5px;color:var(--tx2);margin-top:1px}
.topbar .spacer{flex:1}
.search{position:relative;width:230px}
.search input{width:100%;background:var(--surf);border:1px solid var(--bdr);border-radius:20px;padding:8px 12px 8px 32px;font-size:13px;color:var(--tx);transition:border .12s,box-shadow .12s}
.search input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx3)}
.sync{font-size:11px;font-family:var(--mono);color:var(--tx2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.err .dot{background:var(--red)}.sync.load .dot{background:var(--amber)}
.menu-btn{display:none;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);width:34px;height:34px;align-items:center;justify-content:center}
.menu-btn svg{width:18px;height:18px}

.content{flex:1;padding:24px 26px 40px;width:100%;max-width:none}
.appfoot{padding:16px 26px 24px;color:var(--tx3);font-size:11.5px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--bdr)}
.appfoot .fdot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== Buttons ===== */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bdr);background:var(--surf);color:var(--tx);
  border-radius:var(--r);padding:8px 13px;font-size:13px;font-weight:500;transition:.12s}
.btn:hover{background:var(--surf2);border-color:var(--bdr2)}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{filter:brightness(1.12)}
[data-theme="dark"] .btn.pri{color:#16161A}
.btn.sm{padding:5px 10px;font-size:12px}
.btn-del{background:none;border:none;color:var(--tx3);width:26px;height:26px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.btn-del:hover{background:var(--red-bg);color:var(--red)}

/* ===== Cards / sections ===== */
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rlg);box-shadow:var(--shadow)}
.sec-head{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.sec-head:first-child{margin-top:0}
.sec-head h2{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:-.005em}
.sec-head h2::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:9px;vertical-align:middle;position:relative;top:-1px}
.sec-head .sub{font-size:12.5px;color:var(--tx2)}
.sec-head .spacer{flex:1}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:8px}
.stat{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rlg);padding:13px 15px;cursor:pointer;transition:.12s;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--bdr2)}
.stat.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
.stat .n{font-size:24px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--tx2);margin-top:2px;display:flex;align-items:center;gap:5px}
.stat .l .sw{width:8px;height:8px;border-radius:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rlg);padding:18px;box-shadow:var(--shadow)}
.kpi .lab{font-size:12px;color:var(--tx2);font-weight:500}
.kpi .big{font-size:30px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .meta{font-size:12px;color:var(--tx2);margin-top:6px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.chartbox{padding:18px}
.chartbox h3{font-size:13px;font-weight:600;margin-bottom:14px;color:var(--tx)}
.chartbox .cv{position:relative;height:220px}

/* progress bar */
.prog{height:7px;background:var(--surf3);border-radius:20px;overflow:hidden}
.prog>span{display:block;height:100%;background:var(--green);border-radius:20px;transition:width .4s}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;font-family:var(--mono)}
.p-ns{background:var(--surf3);color:var(--tx2)}
.p-up{background:var(--red-bg);color:var(--red)}
.p-cancel{background:var(--surf3);color:var(--tx3);text-decoration:line-through}
.p-ot{background:var(--green-bg);color:var(--green-tx)}
.p-ar{background:var(--amber-bg);color:var(--amber-tx)}
.p-dn{background:var(--blue-bg);color:var(--blue-tx)}
.p-lead{background:var(--purple-bg);color:var(--purple-tx)}
.p-lag{background:var(--teal-bg);color:var(--teal-tx)}
.tag{font-size:10.5px;font-family:var(--mono);padding:1px 6px;border-radius:5px;background:var(--surf3);color:var(--tx2)}
.tag.over{background:var(--red-bg);color:var(--red)}
.tag.soon{background:var(--amber-bg);color:var(--amber-tx)}
.todoin{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-size:13px;color:var(--tx);width:100%;font-family:var(--font)}
.todoin:hover{border-color:var(--bdr)}
.todoin:focus{outline:none;border-color:var(--blue);background:var(--surf)}
.ministatus{font-size:11px;font-weight:600;font-family:var(--mono);border:1px solid var(--bdr);border-radius:20px;padding:2px 8px;cursor:pointer}
.ministatus:focus{outline:none;border-color:var(--blue)}

/* rock cards */
.rocklist{display:flex;flex-direction:column;gap:9px}
.rock{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rlg);box-shadow:var(--shadow);overflow:hidden}
.rock.done{background:var(--green-bg);border-color:var(--green)}
.rock.done .rock-bd{background:var(--surf)}
.todo-tabs .cnt{display:inline-block;min-width:16px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--amber-bg,#FAEEDA);color:var(--amber-tx,#633806);font-size:10px;font-weight:700}
.todo-tabs{flex-wrap:wrap;gap:6px}
#auth-screen{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;background:var(--sb);padding:20px}
.auth-card{background:var(--surf);border-radius:var(--rlg);box-shadow:var(--shadow-lg);width:100%;max-width:380px;padding:26px 26px 20px}
.auth-brand{display:flex;align-items:center;gap:8px;font-family:var(--serif,Georgia,serif);font-weight:600;font-size:17px;margin-bottom:14px}
.auth-card h2{font-size:18px;margin:0 0 4px}.auth-sub{font-size:12.5px;color:var(--tx2);margin:0 0 16px}
.auth-card label{display:block;font-size:11px;color:var(--tx2);font-weight:500;margin:0 0 5px}.auth-hint{color:var(--tx3);font-weight:400}
.auth-card input{width:100%;background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--r);padding:9px 11px;margin-bottom:14px;font-size:14px;color:var(--tx)}
.auth-go{width:100%;justify-content:center;padding:10px}.auth-links{display:flex;justify-content:space-between;gap:10px;margin-top:14px;font-size:12px}
.auth-links a{color:var(--blue,#2563eb);text-decoration:none}.auth-err{margin-top:12px;font-size:12.5px;color:var(--red)}.auth-msg{margin-top:12px;font-size:12.5px;color:var(--green-tx)}
.sb-user{display:flex;justify-content:space-between;gap:8px;padding:0 12px 10px;font-size:11.5px;color:var(--sb-tx);opacity:.8}.sb-user span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sb-user a{color:var(--sb-tx);text-decoration:underline}
.btn.linkish{background:transparent;border-color:transparent;color:var(--tx3);box-shadow:none}.btn.linkish:hover{color:var(--tx);border-color:var(--bdr)}
.removedlist{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px;margin:0 0 12px;border:1px dashed var(--bdr2);border-radius:var(--r);font-size:12px}
.rmitem{display:inline-flex;align-items:center;gap:6px}
.kauto{font-size:11px;font-weight:600;border:1px dashed var(--bdr2);border-radius:20px;padding:2px 8px;white-space:nowrap}
.cylist{max-height:55vh;overflow:auto;border:1px solid var(--bdr);border-radius:var(--r)}
.cygrp{padding:6px 0;border-bottom:1px solid var(--bdr)}.cygrp:last-child{border-bottom:0}
.cyhd{font-size:11px;color:var(--tx2);padding:4px 12px;text-transform:uppercase;letter-spacing:.04em}
.cyrow{display:flex !important;align-items:center;gap:10px;padding:6px 12px;margin:0 !important;font-size:13px !important;color:var(--tx) !important;cursor:pointer}
.cyrow:hover{background:var(--surf2)}.cyrow input{width:auto !important;margin:0 !important}
.cydesc{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cyrec{font-size:11px;color:var(--tx3);display:flex;align-items:center;gap:4px;white-space:nowrap}
.pastdue{font-size:10px;font-family:var(--mono);color:var(--red);margin-top:3px;white-space:normal;line-height:1.25}
.todotbl{table-layout:fixed}.todotbl td select{width:100%;max-width:100%;text-overflow:ellipsis}.todotbl .todoin{text-overflow:ellipsis}
.draghandle{cursor:grab;white-space:nowrap;user-select:none;color:var(--tx3)}
.draghandle .grip{opacity:.45;margin-right:5px;font-size:12px}
.draghandle:hover .grip{opacity:1}
tr.subrow.dragging,tr.todorow.dragging{opacity:.4}
tr.todorow.dropto td{border-top:2px solid var(--green)}
tr.subrow.dropto td{border-top:2px solid var(--green)}
.rock.unp{background:linear-gradient(0deg,var(--red-bg),var(--red-bg)),var(--surf);background-blend-mode:multiply}
.rock-hd{display:flex;align-items:center;gap:13px;padding:14px 16px;cursor:pointer}
.rock-hd .chev{width:16px;height:16px;color:var(--tx3);transition:transform .15s;flex:0 0 auto}
.rock.open .rock-hd .chev{transform:rotate(90deg)}
.rock-hd .ttl{font-weight:600;font-size:14px;outline:none;flex:0 1 auto;min-width:40px}
.rock-hd .ttl:focus{background:var(--blue-bg);border-radius:4px;padding:0 3px}
.rock-hd .owner{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:5px}
.rock-hd .spacer{flex:1}
.rock-hd .progwrap{width:90px}
.rock-hd .pct{font-size:11px;font-family:var(--mono);color:var(--tx2);width:34px;text-align:right}
.rock-hd .score{font-size:11px;font-family:var(--mono);background:var(--surf3);padding:2px 7px;border-radius:6px;color:var(--tx2)}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--blue-bg);color:var(--blue-tx);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.avstack{display:inline-flex;align-items:center;flex:0 0 auto}
.avstack .avatar{margin-right:-6px;box-shadow:0 0 0 1.5px var(--surf)}
.avstack .avatar:last-child{margin-right:0}
.avmore{background:var(--surf3);color:var(--tx2)}
.rock-bd{display:none;border-top:1px solid var(--bdr);padding:0}
.rock.open .rock-bd{display:block}
.subtabs{display:flex;gap:4px;padding:10px 16px 0}
.subtabs button{background:none;border:none;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--tx2);border-radius:6px}
.subtabs button.on{background:var(--surf2);color:var(--tx)}
.subpane{padding:12px 16px 16px;display:none}
.subpane.on{display:block}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);font-weight:600;padding:7px 9px;border-bottom:1px solid var(--bdr)}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--bdr);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--surf2)}
.tbl input,.tbl select{background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;width:100%}
.tbl input:hover,.tbl select:hover{border-color:var(--bdr)}
.tbl input:focus,.tbl select:focus{outline:none;border-color:var(--blue);background:var(--surf)}

/* ---- Sub-rock / rock status logic (matches original roll-up) ---- */
function rockStatus(rock){
  var subs=rock.subrocks||[];
  if(!subs.length)return rock.status||'Unplanned';
  var st=subs.map(function(s){return subStatus(s);}).filter(function(s){return s!=='Cancelled';});

  var done=subs.filter(function(s){return s.doneDate||s.status==='Done';}).length;
  return Math.round(done/subs.length*100);

function isPastDue(s){if(!s||!s.targetDate)return false;var d=daysUntil(s.targetDate);return d!==null&&d<0;}

/* ============================================================
   Persistence — localStorage immediate + Supabase debounced
   ------------------------------------------------------------
   Sync model (v2):
   - BASE = last workbook we know the server holds. Kept in memory
     and in localStorage so it survives reloads.
   - Merges are 3-way: for any item both sides hold, if our copy is
     unchanged since BASE we take the server's version (a teammate's
     edit); if we changed it, ours wins. New items from either side
     are kept; deletes propagate via tombstones (WB.deleted).
   - Writes are conditional on the server's updated_at, so two
     people saving at once can't silently overwrite each other: the
     loser re-reads, re-merges and retries.
   - A "pending" flag in localStorage marks edits not yet confirmed

   ============================================================ */

}
function setPending(on){try{if(on)localStorage.setItem(STORE_PENDING,'1');else localStorage.removeItem(STORE_PENDING);}catch(e){}}

function setBase(wbData,ts){

}

/* Write WB to the server. Resolves 'ok' | 'conflict' | 'err'.
   With a known server timestamp we PATCH only if the row is unchanged
   since we read it (compare-and-swap). Otherwise fall back to upsert. */
function pushSupabase(opts){
  opts=opts||{};

  var snapshot=clone(WB);
  var body=JSON.stringify({id:SB_ID,data:snapshot,updated_at:ts});
  function done(){setBase(snapshot,ts);return 'ok';}
  function upsert(){
    return sbFetch(SB_URL+'/rest/v1/'+SB_TABLE,{method:'POST',keepalive:!!opts.keepalive,
      extraHeaders:{'Prefer':'resolution=merge-duplicates'},body:body})
      .then(function(r){return r.ok?done():'err';});
  }
  if(_tsSupported&&_remoteTs){
    return sbFetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+encodeURIComponent(SB_ID)+'&updated_at=eq.'+encodeURIComponent(_remoteTs),{
      method:'PATCH',keepalive:!!opts.keepalive,extraHeaders:{'Prefer':'return=representation'},body:body

      return r.json().then(function(rows){
        if(Array.isArray(rows)&&rows.length){ts=rows[0].updated_at||ts;return done();}
        return 'conflict';     /* someone saved since our read */

/* 3-way merge of a small keyed object (e.g. {Molly:{removedFrom:'2026-09-28'}}): per key, ours if we changed it, else theirs. */

    var m=Object.assign({},mergeObj(pcFields(lp),pcFields(rp),bp?pcFields(bp):{}));

    deleted:mergeDeleted(local.deleted,remote.deleted),
    todoPeople:mergeObj(local.todoPeople,remote.todoPeople,base.todoPeople),
    portcos:mergePortcos(local.portcos,remote.portcos,base.portcos),
    accounts:mergeObj(local.accounts,remote.accounts,base.accounts),
    feedback:mergeFlat(local.feedback||[],remote.feedback||[],base.feedback),
    trash:mergeFlat(local.trash||[],remote.trash||[],base.trash).sort(function(a,b){return (b.at||0)-(a.at||0);}).slice(0,60),
    quarters:{}};

/* Apply a server copy into WB via 3-way merge (keeps our unsynced edits). */
function absorbRemote(res){
  var remote=toWB(res.data);
  if(!(remote&&remote.quarters&&Object.keys(remote.quarters).length))return false;
  var aq=WB.activeQuarter;
  WB=mergeWB(WB,remote,BASE?toWB(BASE):null);

  setBase(res.data,res.ts);

/* Read latest -> merge -> conditional write; retry on conflict. */
function pushMergedSave(attempt){
  if(!SB_ENABLED)return;
  if(_pushing){_pushAgain=true;return;}
  _pushing=true;attempt=attempt||0;
  setSync('load');
  loadSupabase().then(function(res){
    if(!res.ok){return 'err';}
    if(res.data){try{absorbRemote(res);}catch(e){console.error('[rocks] merge failed',e);return 'err';}}
    else{_remoteTs=null;}
    WB._v=DATA_VERSION;
    try{localStorage.setItem(STORE,JSON.stringify(WB));}catch(e){}
    return pushSupabase();
  }).then(function(result){
    _pushing=false;
    if(result==='conflict'&&attempt<4){pushMergedSave(attempt+1);return;}
    if(result==='ok'){_lastErr=false;_lastRemoteSig=sig(BASE);if(!_pushAgain&&!_saveTimer)setPending(false);setSync('ok');}
    else{_lastErr=true;setSync('err');}
    if(!isEditing()){renderQuarterSel();render(CUR);}
    if(_pushAgain){_pushAgain=false;pushMergedSave();}
  });
}

var BLK_STATUS=['Open','In Progress','Resolved'];

function blkOpen(b){return blkStatus(b)!=='Resolved';}
function blkKind(b){return b.kind==='ask'?'ask':'blocker';}
function blkList(){return (D&&D.blockers)||[];}
function blkRock(b){return b.rockId?findRockById(b.rockId):null;}
function blkSub(b){var r=blkRock(b);return r&&b.subId?(r.subrocks||[]).find(function(x){return x.id===b.subId;}):null;}
function blkTodo(b){return b.todoId?(WB.todos||[]).find(function(x){return x.id===b.todoId;}):null;}
function blkContext(b){var r=blkRock(b),s=blkSub(b),t=blkTodo(b);if(s)return (r.title||'')+' › '+(s.title||'');if(t)return 'To-do: '+(t.desc||'')+(r?' · '+(r.title||''):'');if(r)return r.title||'';return b.rock||'';}
function blkPortco(b){if((b.portco||'').trim())return b.portco.trim();var s=blkSub(b);if(s&&(s.portco||'').trim())return s.portco.trim();var t=blkTodo(b);if(t&&todoPortco(t))return todoPortco(t);var r=blkRock(b);return r?rockPortco(r):'';}
function blkAge(b){if(!b.at)return null;var d=new Date(b.at);if(isNaN(d))return null;return Math.max(0,Math.round((today0()-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/86400000));}

  return list.slice().sort(function(a,b){return (blkOpen(b)-blkOpen(a))||((blkAge(b)||0)-(blkAge(a)||0));}).map(function(b){var age=blkAge(b);var ctx=blkContext(b);

      '<select class="ministatus '+({Open:'p-up','In Progress':'p-ar',Resolved:'p-ot'}[blkStatus(b)])+'" onclick="event.stopPropagation()" onchange="blkSet(\''+b.id+'\',\'status\',this.value)">'+selOpts(BLK_STATUS,blkStatus(b))+'</select></div>';}).join('');}

function renderOverview(){

  var allSubsQ=allSubs().filter(function(x){return subStatus(x.sub)!=='Cancelled';});
  var subs=allSubsQ.filter(function(x){return !isProject(x.rock);});
  var nProj=allRocks().filter(function(x){return isProject(x.rock);}).length;
  var total=rocks.length;
  var c=statusCounts(rocks);
  var doneRocks=c.Done;
  var subDone=subs.filter(function(x){return subStatus(x.sub)==='Done';}).length;
  var pctSub=subs.length?Math.round(subDone/subs.length*100):0;
  var wPct=weightedPct(rocks);
  var twAll=0,twDone=0;rocks.forEach(function(r){var w=rockWeight(r);twAll+=w;if(rockStatus(r)==='Done')twDone+=w;});
  var pctRocks=twAll?Math.round(twDone/twAll*100):0;

  html+=kpi('Sub-rock completion',wPct+'%',subDone+' of '+subs.length+' sub-rocks · weighted','prog'+wPct);

  html+='</div>';

  html+='<div class="card chartbox"><h3>Overall status <span class="kmini">rocks only</span></h3><div class="cv"><canvas id="ov-status"></canvas></div></div>';
  html+='</div>';

  // alerts
  html+='<div class="grid2" style="margin-top:16px">';

  html+='</div></div>';

/* Stat tiles for projects (kept apart from hard-rock numbers). */
function projectStatsRow(prj,psubs,title,note){
  var h='<div class="sec-head" style="margin-top:4px"><h2>'+title+'</h2><span class="sub">'+note+'</span></div>';
  prj=prj.filter(function(r){return rockStatus(r)!=='Cancelled';});psubs=psubs.filter(function(x){return subStatus(x.sub)!=='Cancelled';});
  if(!prj.length)return h+'<div class="card" style="margin-bottom:20px"><div class="empty" style="padding:16px">No projects this quarter.</div></div>';
  var c=statusCounts(prj);var tw=0,twd=0;prj.forEach(function(r){var w=rockWeight(r);tw+=w;if(rockStatus(r)==='Done')twd+=w;});var pr=tw?Math.round(twd/tw*100):0;
  var sd=psubs.filter(function(x){return subStatus(x.sub)==='Done';}).length;var ps=weightedPct(prj);
  var over=psubs.filter(function(x){if(subStatus(x.sub)==='Done')return false;var d=daysUntil(x.sub.targetDate);return d!==null&&d<0;}).length;
  var att=c['At Risk']+c.Unplanned;
  h+='<div class="kpis">'+kpi('Projects completed',pr+'%',prj.length+' project'+(prj.length>1?'s':'')+' · '+c.Done+' completed · '+c['At Risk']+' at risk','prog'+pr)+

function renderNorthStar(){

  var h='<div class="card tablecard"><table class="tbl"><thead><tr>';

    h+='<td><input class="num" value="'+esc(m.target)+'" onchange="nsSet('+i+',\'target\',this.value)" style="width:60px"></td>';
    (m.weeks||[]).forEach(function(v,wi){h+='<td><input class="num" value="'+esc(v)+'" onchange="nsWeek('+i+','+wi+',this.value)" style="width:46px"></td>';});
    h+='<td class="num" style="font-weight:600">'+(tot||'')+'</td>';

function saveText(){var v=$('#tx-val').value;var cb=_txtCb;_txtCb=null;closeModal('modal-text');if(cb)cb(v);}

/* ---- Sub-Rocks tab ---- */
function portcoOpts(v){return '<option value=""'+(!v?' selected':'')+'>—</option>'+PORTCOS.map(function(p){return '<option'+(v===p?' selected':'')+'>'+esc(p)+'</option>';}).join('');}
function statusOpts(v){return STATUSES.map(function(s){return '<option'+(v===s?' selected':'')+'>'+esc(s)+'</option>';}).join('');}

  var subs=rock.subrocks||[];
  var h='<div class="tablecard"><table class="tbl"><thead><tr><th style="width:24px">#</th><th style="min-width:180px">Sub-Rock</th><th>Owner</th><th>PortCo</th><th>Target</th><th>Done</th><th>Status</th><th style="min-width:160px">Comments</th><th></th></tr></thead><tbody>';

    h+='<td><input class="ownin" list="owner-options" value="'+esc(s.owner)+'" placeholder="Owner(s)" title="Separate multiple owners with commas" onchange="subSet(\''+type+'\',\''+rock.id+'\',\''+s.id+'\',\'owner\',this.value)"></td>';
    h+='<td><select onchange="subSet(\''+type+'\',\''+rock.id+'\',\''+s.id+'\',\'portco\',this.value)">'+portcoOpts(s.portco)+'</select></td>';
    h+='<td><input type="date" value="'+esc(s.targetDate)+'" onchange="subSet(\''+type+'\',\''+rock.id+'\',\''+s.id+'\',\'targetDate\',this.value)"></td>';
    h+='<td><input type="date" value="'+esc(s.doneDate)+'" onchange="subDone(\''+type+'\',\''+rock.id+'\',\''+s.id+'\',this.value)"></td>';
    var stored=s.doneDate?'Done':(s.status||'Not Started');var pd=stored!=='At Risk'&&subStatus(s)==='At Risk';
    h+='<td><select onchange="subSet(\''+type+'\',\''+rock.id+'\',\''+s.id+'\',\'status\',this.value)">'+statusOpts(stored)+'</select>'+(pd?'<div class="pastdue" title="Past its target date and not Done, so it counts as At Risk in the rock roll-up and dashboards.">past due · counts as At Risk</div>':'')+'</td>';
    h+='<td><div class="subcmt'+(s.comment?'':' empty')+'" title="Click to read or edit" onclick="editSubComment(\''+type+'\',\''+rock.id+'\',\''+s.id+'\')">'+(s.comment?esc(s.comment):'+ add comment')+'</div></td>';
    h+='<td style="white-space:nowrap"><button class="btn-flag" title="Flag a blocker or ask on this sub-rock" onclick="openBlk({rockId:\''+rock.id+'\',subId:\''+s.id+'\'})">⚑</button><button class="btn-del" onclick="delSub(\''+type+'\',\''+rock.id+'\',\''+s.id+'\')">✕</button></td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div style="display:flex;gap:8px;margin-top:10px"><input id="newsub-'+rock.id+'" placeholder="New sub-rock title…" style="flex:1;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:8px 10px" onkeydown="if(event.key===\'Enter\')addSub(\''+type+'\',\''+rock.id+'\')"><button class="btn sm" onclick="addSub(\''+type+'\',\''+rock.id+'\')">Add sub-rock</button></div>';
  h+='<div class="hint" style="margin-top:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Setting a Done date auto-marks the sub-rock complete. Sub-rocks with no target date are flagged Unplanned.</div>';

function addSub(type,rid){
  var inp=$('#newsub-'+rid);var t=inp?inp.value.trim():'';if(!t)return;
  var r=getRocks(type).find(function(x){return x.id===rid;});
  r.subrocks=r.subrocks||[];
  r.subrocks.push({id:uid(),title:t,kr:'',owner:'',dept:'',portco:'',score:'',targetDate:'',doneDate:'',status:'Not Started',milestones:Array(12).fill(''),msNotes:Array(12).fill('')});
  save();rerenderCurrent();
}
function findSub(type,rid,sid){var r=getRocks(type).find(function(x){return x.id===rid;});if(!r)return null;return (r.subrocks||[]).find(function(s){return s.id===sid;});}
var _subDrag=null,_subArm=false;
function subDragStart(e,i){_subDrag=i;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(i));}catch(x){}e.currentTarget.classList.add('dragging');}
function subDragOver(e){if(_subDrag===null)return;e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(x){}e.currentTarget.classList.add('dropto');}
function subDragEnd(){_subDrag=null;_subArm=false;document.querySelectorAll('tr.subrow').forEach(function(r){r.classList.remove('dragging','dropto');r.draggable=false;});}
function subDrop(e,type,rid,to){e.preventDefault();var from=_subDrag;subDragEnd();if(from===null||from===to)return;
  var r=getRocks(type).find(function(x){return x.id===rid;});if(!r||!r.subrocks)return;
  var it=r.subrocks.splice(from,1)[0];r.subrocks.splice(to,0,it);save();rerenderCurrent();}
/* Record when a sub-rock's target date moves later (shown on the Weekly Review as "slipped"). */
function noteSlip(s,oldV,newV){if(oldV&&newV&&newV>oldV){s.slips=(s.slips||[]).concat([{from:oldV,to:newV,at:isoDate(new Date()),by:(typeof myName==='function'&&myName())||''}]).slice(-10);}}
function subSet(type,rid,sid,k,v){var s=findSub(type,rid,sid);if(!s)return;if(k==='targetDate')noteSlip(s,s.targetDate,v);s[k]=v.trim?v.trim():v;if(k==='status'){if(s.status==='Done'&&!s.doneDate){var t=new Date();s.doneDate=t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2);}else if(s.status!=='Done'){s.doneDate='';}}if(s.todoId)pushSubToTodo(s);save();rerenderCurrent();}
function subDone(type,rid,sid,v){var s=findSub(type,rid,sid);if(!s)return;s.doneDate=v;if(v)s.status='Done';else if(s.status==='Done')s.status='On Track';if(s.todoId)pushSubToTodo(s);save();rerenderCurrent();}
function delSub(type,rid,sid){var r=getRocks(type).find(function(x){return x.id===rid;});var s=(r.subrocks||[]).find(function(x){return x.id===sid;});if(s&&s.todoId){var t=(WB.todos||[]).find(function(x){return x.id===s.todoId;});if(t){t.subId='';t.rockId='';}}if(s)trashPush('sub',s.title,s,{quarter:WB.activeQuarter,rockId:rid});tomb(sid);r.subrocks=r.subrocks.filter(function(x){return x.id!==sid;});save();rerenderCurrent();}

/* ---- Timeline (read-only): each sub-rock's target date across the quarter's weeks ---- */
function milestonesTab(type,rock){
  var subs=(rock.subrocks||[]).filter(function(s){return subStatus(s)!=='Cancelled';});var wk=weekDates();
  /* a quarter is ~13 weeks; extend (up to 16) so today and late target/done dates stay on the chart */
  var last=today0();subs.forEach(function(s){[s.targetDate,s.doneDate].forEach(function(v){if(v){var d=new Date(v+'T00:00:00');if(!isNaN(d)&&d>last)last=d;}});});
  while(wk.length<16&&(wk.length<13||new Date(wk[wk.length-1].getTime()+7*86400000)<=last)){var nx=new Date(wk[wk.length-1]);nx.setDate(nx.getDate()+7);wk.push(nx);}
  if(!subs.length)return '<div class="empty">Add sub-rocks first to see them on the timeline.</div>';
  var t0=wk[0].getTime(),t1=wk[wk.length-1].getTime()+7*86400000,span=t1-t0;
  function pos(iso){var d=new Date(iso+'T00:00:00');if(isNaN(d))return null;return Math.max(0,Math.min(100,(d.getTime()-t0)/span*100));}
  var now=today0().getTime();var nowP=(now>=t0&&now<=t1)?(now-t0)/span*100:null;
  var grid=wk.map(function(d,i){return '<span class="tlw" style="left:'+(i/wk.length*100)+'%"></span>';}).join('');
  var h='<div class="tl"><div class="tlrow tlhead"><div class="tlname"></div><div class="tltrack">'+wk.map(function(d,i){return '<span class="tllab" style="left:'+(i/wk.length*100)+'%">'+fmtWeek(d)+'</span>';}).join('')+(nowP!==null?'<span class="tlnowlab" style="left:'+nowP+'%">today</span>':'')+'</div></div>';
  subs.slice().sort(function(a,b){return (a.targetDate||'9999').localeCompare(b.targetDate||'9999');}).forEach(function(s){
    var st=subStatus(s);var tp=s.targetDate?pos(s.targetDate):null;var dp=s.doneDate?pos(s.doneDate):null;
    var cls={'Done':'tl-done','At Risk':'tl-risk','On Track':'tl-ok','Not Started':'tl-ns'}[st]||'tl-ns';
    var d=daysUntil(s.targetDate);var note=!s.targetDate?'no target date':st==='Done'?'done '+fmtDate(s.doneDate||s.targetDate):d<0?(-d)+'d overdue':'due '+fmtDate(s.targetDate);
    h+='<div class="tlrow"><div class="tlname" title="'+esc(s.title)+'"><div>'+esc(s.title||'(untitled)')+'</div><div class="rname">'+esc(ownersOf(s).join(', ')||'unassigned')+' · '+esc(note)+'</div></div><div class="tltrack">'+grid+(nowP!==null?'<span class="tlnow" style="left:'+nowP+'%"></span>':'');
    if(tp!==null&&st!=='Done'&&nowP!==null&&d<0)h+='<span class="tlslip" style="left:'+tp+'%;width:'+Math.max(0,nowP-tp)+'%"></span>';
    if(tp!==null)h+='<span class="tlmark '+cls+(st==='Done'?' tl-tgt':'')+'" style="left:'+tp+'%" title="Target '+esc(fmtDate(s.targetDate))+' · '+esc(st)+'"></span>';
    if(dp!==null)h+='<span class="tlmark tl-done tl-fill" style="left:'+dp+'%" title="Done '+esc(fmtDate(s.doneDate))+'"></span>';
    if(tp===null&&dp===null)h+='<span class="tlnone">no target date</span>';
    h+='</div></div>';
  });
  h+='</div><div class="hint" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Each marker is a sub-rock’s target date, coloured by status; a filled green dot is when it was done, and a red bar shows how far past due it is. The blue line is today. Change dates in the Sub-Rocks tab.</div>';
  return h;
}
function isoOf(i){var d=weekDates()[i];return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function msClick(type,rid,sid,i,e){if(e&&e.shiftKey){return msTarget(type,rid,sid,i,e);}var s=findSub(type,rid,sid);if(!s)return;var iso=isoOf(i);if(s.doneDate===iso){s.doneDate='';if(s.status==='Done')s.status='On Track';}else{s.doneDate=iso;s.status='Done';}if(s.todoId)pushSubToTodo(s);save();rerenderCurrent();}
function msTarget(type,rid,sid,i,e){if(e)e.preventDefault();var s=findSub(type,rid,sid);if(!s)return;s.targetDate=isoOf(i);if(s.todoId)pushSubToTodo(s);save();rerenderCurrent();return false;}

/* ---- Add Rock form ---- */
function showAddRock(type){

  f.classList.add('on');
  f.innerHTML='<div class="row"><div><label>Title</label><input id="ar-title-'+type+'" placeholder="What\'s the goal or project?"></div><div><label>Owner</label><input id="ar-owner-'+type+'" list="owner-options" placeholder="Who owns it?"></div></div><div class="arkind"><label class="arkopt"><input type="radio" name="ar-kind-'+type+'" value="hard" checked><span><b>Rock</b><small>A goal we are committing to this quarter. Counts toward KPIs and completion.</small></span></label><label class="arkopt"><input type="radio" name="ar-kind-'+type+'" value="project"><span><b>Project</b><small>Something that came up during the quarter. Tracked the same way, but not counted in KPIs or completion.</small></span></label></div><div class="acts"><button class="btn" onclick="hideAddRock(\''+type+'\')">Cancel</button><button class="btn pri" onclick="addRock(\''+type+'\')">Add</button></div>';
  setTimeout(function(){var t=$('#ar-title-'+type);if(t)t.focus();},30);

function hideAddRock(type){var f=$('#addform-'+type);if(f){f.classList.remove('on');f.innerHTML='';}}
function addRock(type){
  var t=$('#ar-title-'+type),o=$('#ar-owner-'+type);
  var title=t?t.value.trim():'';if(!title){if(t)t.focus();return;}
  var kEl=document.querySelector('input[name="ar-kind-'+type+'"]:checked');var kind=kEl&&kEl.value==='project'?'project':'hard';
  D[ROCK_ARR[type]].push({id:uid(),title:title,dim:'',owner:o?o.value.trim():'',dept:'',portco:'',cat:type,kind:kind,score:'',weight:'',desc:'',comments:[],links:[],subrocks:[]});

function delRock(type,id,e){
  if(e)e.stopPropagation();
  var r=getRocks(type).find(function(x){return x.id===id;});
  confirmDelete('Delete Rock?','Move “'+(r?r.title:'this rock')+'” (and its sub-rocks) to Trash. You can restore it from the Trash page.',function(){
    if(r)trashPush('rock',r.title,r,{quarter:WB.activeQuarter,cat:(r.cat||type)});
    tomb(id);D[ROCK_ARR[type]]=getRocks(type).filter(function(x){return x.id!==id;});
    save();render(CUR);updateBadges();
  });
}

var _indSort='';
function setIndSort(v){_indSort=v;render(CUR);}
function rockDue(r){var ds=(r.subrocks||[]).filter(function(s){return s.targetDate&&subStatus(s)!=='Done';}).map(function(s){return s.targetDate;});if(!ds.length)return '';ds.sort();return ds[0];}

function setRockStatus(type,id,v){var r=getRocks(type).find(function(x){return x.id===id;});if(r){r.status=v;save();render(CUR);}}
function renderDashInd(){

/* People for the By Individual picker: rock/sub-rock owners, to-do people and scorecard, active this quarter. */
function indPeople(){var out=[];function add(n){n=String(n||'').trim();if(n&&n!=='Unassigned'&&!out.some(function(x){return ownerMatches(x,n);}))out.push(n);}
  try{todoOwners(currentWeekStart()).forEach(add);}catch(e){}((WB.scorecard&&WB.scorecard.people)||[]).forEach(function(pp){if(!scRemoved(pp))add(pp.name);});
  allRocks().forEach(function(x){ownersOf(x.rock).forEach(add);(x.rock.subrocks||[]).forEach(function(s){ownersOf(s).forEach(add);});});
  return out.sort(function(a,b){return a.localeCompare(b);});}
function renderDashIndAll(p,bar){
  var rby={},sby={};
  allRocks().filter(function(x){return kindOk(x.rock)&&closedOk(x.rock);}).forEach(function(x){var ows=ownersOf(x.rock);if(!ows.length)ows=['Unassigned'];ows.forEach(function(o){(rby[o]=rby[o]||[]).push(x);});});
  allSubs().filter(function(x){return kindOk(x.rock)&&closedOk(x.rock);}).forEach(function(x){var ows=ownersOf(x.sub);if(!ows.length)ows=['Unassigned'];ows.forEach(function(o){(sby[o]=sby[o]||[]).push(x);});});
  var nm={};Object.keys(rby).forEach(function(n){nm[n]=1;});Object.keys(sby).forEach(function(n){nm[n]=1;});
  var names=Object.keys(nm).sort(function(a,b){return ((rby[b]||[]).length+(sby[b]||[]).length)-((rby[a]||[]).length+(sby[a]||[]).length);});
  _indLast=names.slice();
  var sel='';
  var h=bar+'<div class="filt">'+kindFilterBar()+
    '<span class="lbl" style="margin-left:12px">Sort:</span><button class="btn sm'+(_indSort!=='due'?' pri':'')+'" onclick="setIndSort(\'\')">Status</button><button class="btn sm'+(_indSort==='due'?' pri':'')+'" onclick="setIndSort(\'due\')">Due date</button><span class="spacer" style="flex:1"></span><button class="btn sm" onclick="setAllGrp(\'ind\',true)">Expand all</button><button class="btn sm" onclick="setAllGrp(\'ind\',false)">Collapse all</button></div>';
  if(!names.length){h+=emptyState('user','No owners yet','Assign owners to rocks or sub-rocks to see workload here.');p.innerHTML=h;return;}
  h=h.replace('<div class="filt">'+kindFilterBar(),'<div class="filt">'+kindFilterBar()+closedFilterBar(allRocks().filter(function(x){return isClosed(x.rock);}).length));
  names.filter(function(n){return !sel||sel===n;}).forEach(function(n){
    var rk=rby[n]||[],sb=sby[n]||[];
    var sbH=sb.filter(function(x){return !isProject(x.rock);}),rkH=rk.filter(function(x){return !isProject(x.rock);});
    var doneSubs=sbH.filter(function(x){return subStatus(x.sub)==='Done';}).length;
    var pct=sbH.length?Math.round(doneSubs/sbH.length*100):(rkH.length?Math.round(rkH.reduce(function(a,x){return a+rockPct(x.rock);},0)/rkH.length):0);
    var atRisk=sb.filter(function(x){return subStatus(x.sub)==='At Risk';}).length;
    var key='ind-'+n;var open=D.indCollapsed[key]!==true;var nq=esc(n).replace(/'/g,"\\'");
    h+='<div class="dgrp'+(open?' open':'')+'"><div class="dgrp-hd" onclick="toggleGrp(\'ind\',\''+nq+'\')"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>';
    h+='<span class="avatar">'+esc(initials(n))+'</span><span class="nm">'+esc(n)+'</span>';
    h+='<span class="ct">'+rk.length+' rocks · '+sb.length+' sub-rocks · '+pct+'% done'+(atRisk?' · '+atRisk+' at risk':'')+'</span><span class="spacer"></span>';
    h+='<div style="width:120px"><div class="prog"><span style="width:'+pct+'%"></span></div></div></div>';
    h+='<div class="dgrp-bd"><div class="card" style="padding:4px 0">';
    if(_indSort==='due'){
      var items=[];rk.forEach(function(x){items.push({k:'rock',x:x,date:rockDue(x.rock)});});sb.forEach(function(x){items.push({k:'sub',x:x,date:x.sub.targetDate||''});});
      items.sort(function(a,b){if(!a.date&&!b.date)return 0;if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});

/* ---- Carry forward (pick which items) ----
   Source = the person's most recent earlier week with to-dos. Unfinished items and recurring ones are pre-ticked;
   Done items can be ticked too. Each source item is carried once (remembers carriedTo). */
function isRecurring(t){return !!t.recurring||/recurr/i.test(t.notes||'');}
function carryCandidates(owner,week){
  var prev=personWeeks(owner).filter(function(w){return w<week;})[0];if(!prev)return {prev:null,items:[],all:[]};
  var all=todosOf(owner,prev).filter(function(t){return !t.carriedTo&&(t.desc||'').trim()&&todoStatus(t)!=='Cancelled';});
  var items=all.filter(function(t){var st=todoStatus(t);return st==='To Do'||st==='In Progress'||st==='Not Done'||isRecurring(t);});
  return {prev:prev,items:items,all:all};}

    var n={id:uid(),owner:t.owner,weekStart:week,desc:t.desc,status:st==='In Progress'?'In Progress':'To Do',time:t.time||'',notes:t.notes||'',rockId:t.rockId||'',portco:t.portco||'',subId:'',carriedFrom:t.id};

    WB.todos.push(n);t.carriedTo=n.id;});}

/* ---- Sub-rocks due in a week become reminder to-dos for their owners ----
   One per owner, linked to the sub-rock (status stays in sync). Deterministic ids, so two open tabs never duplicate;
   deleting one removes only the reminder (tombstoned, so it isn't re-added) — never the sub-rock. */
function splitOwners(s){return String(s||'').split(/\s*[,\/&]\s*/).map(function(x){return x.trim();}).filter(Boolean);}
function ensureDueTodos(week){if(!week||week<currentWeekStart())return 0;ensureTodos();
  /* clean-up: a reminder is redundant when the same person already has a real to-do linked to that sub-rock this week */
  var redundant=WB.todos.filter(function(t){return t.autoDue&&t.weekStart===week&&t.subId&&WB.todos.some(function(u){return u!==t&&!u.autoDue&&u.weekStart===week&&u.subId===t.subId&&todoHasOwner(u,t.owner);});});
  redundant.forEach(function(t){tomb(t.id);});if(redundant.length){var rid={};redundant.forEach(function(t){rid[t.id]=1;});WB.todos=WB.todos.filter(function(t){return !rid[t.id];});}
  var end=addDaysIso(week,6),del={},have={},linked={};(WB.deleted||[]).forEach(function(x){del[x]=1;});
  WB.todos.forEach(function(t){have[t.id]=1;if(t.subId&&t.weekStart===week)todoOwnerList(t).forEach(function(o){linked[t.subId+'|'+o.toLowerCase()]=1;});});

      if(have[id]||del[id]||linked[s.id+'|'+o.toLowerCase()]||!todoActiveIn(o,week))return;
      WB.todos.push({id:id,owner:o,weekStart:week,desc:s.title||'(untitled sub-rock)',status:sub2td(st),time:'',notes:'',rockId:x.rock.id,subId:s.id,autoDue:true});

  });});

function aggregate(vals,method){var nums=vals.filter(function(v){return typeof v==='number';});if(!nums.length)return '';if(method==='Sum')return Math.round(nums.reduce(function(a,b){return a+b;},0)*1000)/1000;if(method==='Latest'){var last='';vals.forEach(function(v){if(typeof v==='number')last=v;});return last;}return Math.round(nums.reduce(function(a,b){return a+b;},0)/nums.length*1000)/1000;}
function defaultAgg(k){var u=(k.unit||'').toLowerCase();if(u==='#')return 'Sum';return 'Average';}
function kpiAgg(k){return k.agg||defaultAgg(k);}
/* ---- Automatic "Rocks Completion" KPI ----
   Value = share of the person's sub-rocks (in that quarter, not Cancelled) that are Done.
   Monthly value = done by the end of that month (months not started yet stay blank).
   Status = actual vs target pro-rated to how far through the quarter we are:
   On Track if at or above that pace, Behind if within 80% of it, Off Track below. Only the target (Plan) is editable. */
function isAutoRocksKpi(k){return !!k&&/^\s*rocks?\s*complet/i.test(k.name||'');}
var _NAME_ALIAS={leo:'leonardo',leonardo:'leo'};
function ownerMatches(owner,name){var a=String(owner||'').trim().split(/\s+/)[0].toLowerCase(),b=String(name||'').trim().split(/\s+/)[0].toLowerCase();return !!a&&(a===b||_NAME_ALIAS[a]===b);}
function kpiPerson(k){var pp=null;((WB.scorecard&&WB.scorecard.people)||[]).some(function(p){if((p.kpis||[]).indexOf(k)>=0){pp=p;return true;}return false;});return pp;}
function quarterYear(){var m=/(\d{4})/.exec(WB.activeQuarter||'');return m?+m[1]:new Date().getFullYear();}
function quarterLabelFor(qn,year){var want=qOrd('Q'+qn+' '+year);var hit=null;Object.keys(WB.quarters||{}).forEach(function(k){if(qOrd(k)===want)hit=k;});return hit;}
function personSubsIn(qlabel,name){var q=WB.quarters[qlabel];if(!q)return [];var out=[];
  quarterRockList(q).forEach(function(r){if(isProject(r))return;(r.subrocks||[]).forEach(function(s){if((s.status||'')==='Cancelled')return;if(splitOwners(s.owner||r.owner).some(function(o){return ownerMatches(o,name);}))out.push(s);});});return out;}
function doneBy(s,iso){if(s.doneDate)return s.doneDate<=iso;return (s.status||'')==='Done'&&iso>=isoDate(new Date());}
function autoRocks(k){if(!isAutoRocksKpi(k))return null;var pp=kpiPerson(k);if(!pp)return null;
  var year=quarterYear(),today=isoDate(new Date()),monthly=[];
  for(var mi=0;mi<12;mi++){var qn=Math.floor(mi/3)+1,ql=quarterLabelFor(qn,year);var first=isoDate(new Date(year,mi,1)),last=isoDate(new Date(year,mi+1,0));
    if(!ql||first>today){monthly.push('');continue;}var subs=personSubsIn(ql,pp.name);if(!subs.length){monthly.push('');continue;}
    var cut=last<today?last:today;monthly.push(Math.round(subs.filter(function(s){return doneBy(s,cut);}).length/subs.length*1000)/1000);}
  var qn0=parseInt(activeQNum(),10),ql0=quarterLabelFor(qn0,year),subs0=ql0?personSubsIn(ql0,pp.name):[];
  var done0=subs0.filter(function(s){return doneBy(s,today);}).length;var actual=subs0.length?Math.round(done0/subs0.length*1000)/1000:'';
  var plan=k.q&&k.q[qn0]?k.q[qn0].plan:'';var status='';
  if(typeof plan==='number'&&typeof actual==='number'){var qs=new Date(year,(qn0-1)*3,1),qe=new Date(year,qn0*3,1),now=new Date();
    var frac=Math.max(0,Math.min(1,(now-qs)/(qe-qs)));var exp=plan*frac;status=actual>=exp-1e-9?'On Track':actual>=exp*0.8?'Behind':'Off Track';}
  return {monthly:monthly,actual:actual,status:status,done:done0,total:subs0.length};}
function kpiStatus(k,qn){var a=autoRocks(k);if(a)return a.status;return (k.q&&k.q[qn]&&k.q[qn].status)||'';}
function kpiMonth(k,i){var a=autoRocks(k);if(a)return a.monthly[i];return k.monthly?k.monthly[i]:'';}
function qHasMonths(k,qn){if(autoRocks(k))return true;var idx=qMonthIdx(qn);return idx.some(function(i){return typeof (k.monthly&&k.monthly[i])==='number';});}
function qActualVal(k,qn){var au=autoRocks(k);if(au)return au.actual;var idx=qMonthIdx(qn);var vals=idx.map(function(i){return k.monthly?k.monthly[i]:'';});if(vals.some(function(v){return typeof v==='number';}))return aggregate(vals,kpiAgg(k));var q=k.q&&k.q[qn];return q?q.actual:'';}
var _scOpen={},_scMonthly={};
function scToggle(pi){var key='sc-'+pi;_scOpen[key]=!_scOpen[key];render(CUR);}

function scQ(pi,ki,field,val){var k=WB.scorecard.people[pi].kpis[ki];var qn=activeQNum();k.q=k.q||{};k.q[qn]=k.q[qn]||{plan:'',actual:'',status:''};k.q[qn][field]=(field==='status')?val:numOrStr(val);save();render(CUR);}
function scK(pi,ki,field,val){WB.scorecard.people[pi].kpis[ki][field]=(val&&val.trim)?val.trim():val;save();render(CUR);}
function scM(pi,kind,ki,mi,val){var arr=kind==='kpi'?WB.scorecard.people[pi].kpis:WB.scorecard.people[pi].metrics;arr[ki].monthly[mi]=numOrStr(val);save();}

function scMet(pi,ki,mi,val){WB.scorecard.people[pi].metrics[ki].monthly[mi]=numOrStr(val);save();}

function addScMetric(pi){WB.scorecard.people[pi].metrics=WB.scorecard.people[pi].metrics||[];WB.scorecard.people[pi].metrics.push({name:'New metric',desc:'',unit:'',monthly:['','','','','','','','','','','','']});save();render(CUR);}
function delScMetric(pi,ki){WB.scorecard.people[pi].metrics.splice(ki,1);save();render(CUR);}
function primaryKpiName(pp,qn){
  if(pp.primary&&pp.kpis.some(function(k){return k.name===pp.primary;}))return pp.primary;
  var f=pp.kpis.filter(function(k){return k.q&&k.q[qn];})[0]||pp.kpis[0];
  return f?f.name:'';
}
function scSetPrimary(pi,ki){WB.scorecard.people[pi].primary=WB.scorecard.people[pi].kpis[ki].name;save();render(CUR);}
function kpiCard(pi,ki,qn,showPerson){

  var q=(k.q&&k.q[qn])||{plan:'',actual:'',status:''};

  var st=scStatusNorm(kpiStatus(k,qn));

  var stcol=st==='On Track'?'var(--green-tx)':st==='Behind'?'var(--amber-tx)':st==='Off Track'?'var(--red)':'var(--tx3)';
  var att='';if(typeof plan==='number'&&plan!==0&&typeof actual==='number')att=Math.max(0,Math.min(100,Math.abs(actual/plan)*100));
  var varv='';if(typeof plan==='number'&&typeof actual==='number'){var dd=Math.round((actual-plan)*1000)/1000;varv=(dd>=0?'+':'')+dd;}
  var qi=qMonthIdx(qn);var dkey=pi+'-'+ki;var dopen=_scKpiOpen[dkey];

  var h='<div class="kcard">';

  if(showPerson)h+='<span class="kperson">'+esc(pp.name)+(pp.area?' · '+esc(pp.area):'')+'</span>';
  h+='<span class="spacer"></span>';
  h+='<button class="kc-btn kc-star'+(isPrim?' on':'')+'" onclick="scSetPrimary('+pi+','+ki+')" title="'+(isPrim?'Shown in Overview dashboard':'Show this KPI in the Overview')+'">'+(isPrim?'★':'☆')+'</button>';
  if(au)h+='<span class="kstatus kauto" style="color:'+stcol+'" title="Automatic: actual vs target pro-rated to today ('+au.done+' of '+au.total+' sub-rocks done)">'+(st||'—')+' · auto</span>';
  else h+='<select class="kstatus" style="color:'+stcol+'" onchange="scQ('+pi+','+ki+',\'status\',this.value)"><option value="">— status —</option>'+['On Track','Behind','Off Track'].map(function(s){return '<option'+(st===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>';
  if(k.proof)h+='<a class="kc-btn" href="'+esc(k.proof)+'" target="_blank" rel="noopener" title="Open proof">🔗</a>';
  if(!au)h+='<button class="kc-btn kc-chev'+(dopen?' open':'')+'" onclick="scKpiDetail('+pi+','+ki+')" title="Enter monthly actuals, aggregation & proof"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>';
  h+='<button class="kc-btn" onclick="delScKpi('+pi+','+ki+')" title="Delete KPI">✕</button></div>';
  h+='<div class="kc-meta">';
  h+='<span class="kpv">Plan <input value="'+esc(plan)+'" onchange="scQ('+pi+','+ki+',\'plan\',this.value)"></span><span class="arrow">→</span>';
  h+='<span class="kpv">Actual '+(au?'<b class="autoval" style="cursor:default" title="Automatic from the Rocks: '+au.done+' of '+au.total+' of '+esc(pp.name)+'\'s sub-rocks done this quarter">'+fmtKPI(actual,k.unit)+'</b>':hasMon?'<b class="autoval" onclick="scKpiDetail('+pi+','+ki+')" title="Auto: '+kpiAgg(k)+' of months. Click to edit months.">'+fmtKPI(actual,k.unit)+'</b>':'<input value="'+esc(q.actual)+'" placeholder="enter…" onchange="scQ('+pi+','+ki+',\'actual\',this.value)">')+'</span>';
  h+='<div class="kbar"><span class="f-'+sc+'" style="width:'+(att===''?0:att)+'%"></span></div><span class="kvar">'+varv+'</span>';
  var mini=qi.map(function(i){var mv=kpiMonth(k,i);var v=(mv!=null&&mv!=='')?fmtKPI(mv,k.unit):'·';return MONTHS_ABBR[i].charAt(0)+' '+v;}).join('  ');
  h+='<span class="kmini">'+esc(mini)+'</span></div>';
  if(dopen&&!au){
    h+='<div class="kc-edit">';
    qi.forEach(function(i){h+='<div class="fld mon"><label>'+MONTHS_ABBR[i]+'</label><input value="'+esc(k.monthly&&k.monthly[i]!=null?k.monthly[i]:'')+'" onchange="scMQ('+pi+','+ki+','+i+',this.value)"></div>';});
    h+='<div class="fld"><label>Aggregation</label><select onchange="scK('+pi+','+ki+',\'agg\',this.value)">'+['Average','Sum','Latest'].map(function(a){return '<option'+(kpiAgg(k)===a?' selected':'')+'>'+a+'</option>';}).join('')+'</select></div>';
    h+='<div class="fld"><label>Unit</label><input style="width:64px" value="'+esc(k.unit||'')+'" onchange="scK('+pi+','+ki+',\'unit\',this.value)"></div>';
    h+='<div class="fld" style="flex:1;min-width:170px"><label>Proof link</label><input value="'+esc(k.proof||'')+'" placeholder="paste URL" onchange="scK('+pi+','+ki+',\'proof\',this.value)"></div>';
    h+='</div>';
  }
  h+='</div>';return h;
}
function scP(pi,field,val){WB.scorecard.people[pi][field]=(val&&val.trim)?val.trim():val;save();}
function addScPerson(){WB.scorecard.people.push({name:'New person',area:'',kpis:[],metrics:[]});save();render(CUR);}
/* Removing a person is per quarter: hidden from the removal quarter onward, kept in earlier ones.
   Stored as a field (removedFrom) so it syncs to teammates like any other edit. */
function qOrd(label){var m=/Q([1-4])\s*'?(\d{2,4})/i.exec(label||'');if(!m)return null;var y=+m[2];if(y<100)y+=2000;return y*4+(+m[1]-1);}
function scRemoved(pp){if(!pp||!pp.removedFrom)return false;var a=qOrd(WB.activeQuarter),b=qOrd(pp.removedFrom);if(a===null||b===null)return WB.activeQuarter===pp.removedFrom;return a>=b;}
function delScPerson(pi,e){if(e)e.stopPropagation();var pp=WB.scorecard.people[pi];if(!pp)return;var q=WB.activeQuarter;
  confirmDelete('Remove person?','Remove “'+pp.name+'” from '+q+' onward? They and their KPIs stay in earlier quarters. You can restore them from this page.',function(){
    var cur=qOrd(pp.removedFrom),nw=qOrd(q);if(!pp.removedFrom||(cur!==null&&nw!==null&&nw<cur))pp.removedFrom=q;save();render(CUR);});}
function restoreScPerson(pi){var pp=WB.scorecard.people[pi];if(!pp)return;
  /* clears the removal entirely, so they show again in every quarter */

function addScKpi(pi){WB.scorecard.people[pi].kpis.push({name:'New KPI',desc:'',unit:'',monthly:['','','','','','','','','','','',''],q:{},proof:''});save();render(CUR);}
function delScKpi(pi,ki){WB.scorecard.people[pi].kpis.splice(ki,1);save();render(CUR);}
function scMonthlyTable(pp,pi,kind,label){

var _kpiFilter=null;

function renderAllKpis(){

function ovKpiSection(){
  ensureScorecard();var qn=activeQNum();var people=(WB.scorecard.people||[]).filter(function(pp){return !scRemoved(pp);});
  if(!people.length)return '';
  var on=0,beh=0,off=0;

function doSearch(q){
  q=q.trim().toLowerCase();
  if(!q){switchTab(CUR==='__search'?'overview':CUR);return;}
  var hits=[];
  allRocks().forEach(function(x){
    var r=x.rock;
    if((r.title||'').toLowerCase().indexOf(q)>=0||(r.owner||'').toLowerCase().indexOf(q)>=0)hits.push({kind:'Rock',type:x.type,title:r.title,meta:ROCK_LABELS[x.type]+' · '+(r.owner||'unassigned'),go:x.type});

/* Restore: replace the shared workbook with an exported file (not a merge). */
function importData(file){
  var fr=new FileReader();
  fr.onload=function(){
    var wb=null;try{wb=toWB(JSON.parse(fr.result));}catch(e){}
    if(!wb||!wb.quarters||!Object.keys(wb.quarters).length){alert('That file is not a Rocks export.');return;}
    var n=0;Object.keys(wb.quarters).forEach(function(k){n+=quarterRockList(wb.quarters[k]).length;});
    confirmAction('Restore from file?','Replace ALL current data for everyone with "'+file.name+'" ('+Object.keys(wb.quarters).length+' quarters, '+n+' rocks)? Export first if you want a backup of the current data.','Restore',function(){
      if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null;}
      setWB(wb);WB._v=DATA_VERSION;WB.deleted=wb.deleted||[];WB.trash=wb.trash||[];
      try{localStorage.setItem(STORE,JSON.stringify(WB));}catch(e){}
      setPending(true);renderQuarterSel();render(CUR);setSync('load','Restoring…');
      function attempt(k){
        loadSupabase().then(function(res){
          if(!res.ok){setSync('err');return;}
          _remoteTs=res.data?res.ts:null;
          pushSupabase().then(function(r){
            if(r==='ok'){setPending(false);_lastRemoteSig=sig(BASE);setSync('ok','Restored');}
            else if(r==='conflict'&&k<3)attempt(k+1);
            else setSync('err');
          });
        });
      }
      attempt(0);
    });
  };
  fr.readAsText(file);
}

/* Open rocks & projects (not Done/Cancelled) move to the next quarter as projects, with their open sub-rocks and links.
   The owner decides whether to turn one back into a rock (Type field). Idempotent: each item is carried once. */
function openRocksOf(ql){return quarterRockList(WB.quarters[ql]).filter(function(r){return !isClosed(r);});}
function quarterAfter(ql){var o=qOrd(ql);if(o===null)return '';var best='',bo=null;Object.keys(WB.quarters).forEach(function(k){var x=qOrd(k);if(x!==null&&x>o&&(bo===null||x<bo)){bo=x;best=k;}});return best;}
function quarterBefore(ql){var o=qOrd(ql);if(o===null)return '';var best='',bo=null;Object.keys(WB.quarters).forEach(function(k){var x=qOrd(k);if(x!==null&&x<o&&(bo===null||x>bo)){bo=x;best=k;}});return best;}
function uncarried(fromQ,toQ){var dst=WB.quarters[toQ];if(!dst)return [];var have={};quarterRockList(dst).forEach(function(r){if(r.carriedFrom&&r.carriedFrom.id)have[r.carriedFrom.id]=1;});
  return openRocksOf(fromQ).filter(function(r){return !have[r.id]&&r.carriedTo!==toQ;});}
function carryOpenRocks(fromQ,toQ){var list=uncarried(fromQ,toQ);var dst=WB.quarters[toQ];if(!dst||!list.length)return 0;
  list.forEach(function(r){var c=JSON.parse(JSON.stringify(r));c.id=uid();c.kind='project';c.carriedFrom={q:fromQ,id:r.id,kind:r.kind||'hard'};delete c.carriedTo;c.score='';c.comments=[];c.status=(r.subrocks&&r.subrocks.length)?'':(r.status==='Unplanned'?'':r.status||'');
    c.links=(r.links||[]).map(function(l){return Object.assign({},l,{id:uid()});});
    c.subrocks=(r.subrocks||[]).filter(function(s){var st=subStatus(s);return st!=='Done'&&st!=='Cancelled';}).map(function(s){var n=JSON.parse(JSON.stringify(s));n.id=uid();n.todoId='';n.doneDate='';return n;});
    var subMap={};(r.subrocks||[]).forEach(function(s0,i0){});c.subrocks.forEach(function(n){var o=(r.subrocks||[]).find(function(s0){return s0.title===n.title&&s0.targetDate===n.targetDate;});if(o)subMap[o.id]=n.id;});
    ((WB.quarters[fromQ]||{}).blockers||[]).forEach(function(b){if(b.rockId!==r.id||!blkOpen(b))return;dst.blockers=dst.blockers||[];dst.blockers.push(Object.assign({},b,{id:uid(),rockId:c.id,subId:subMap[b.subId]||'',carriedFrom:b.id}));});
    var cat=(r.cat&&ROCK_ARR[r.cat])?r.cat:'build';dst[ROCK_ARR[cat]]=dst[ROCK_ARR[cat]]||[];dst[ROCK_ARR[cat]].push(c);r.carriedTo=toQ;});
  return list.length;}
function askCarry(fromQ,toQ){var n=uncarried(fromQ,toQ).length;if(!n)return;
  confirmAction('Carry open items to '+toQ+'?',n+' rock'+(n>1?'s':'')+' and projects from '+fromQ+' are not Done or Cancelled. Copy them into '+toQ+' as projects, with their open sub-rocks and links? Each owner can switch one back to a rock with the Type field. '+fromQ+' is left as it is.','Carry '+n,function(){var k=carryOpenRocks(fromQ,toQ);save();render(CUR);updateBadges();setSync('load','Carried '+k+' items to '+toQ+'…');});}
function carryBanner(){var q=WB.activeQuarter;var nx=quarterAfter(q),pv=quarterBefore(q);var h='';
  if(nx){var n=uncarried(q,nx).length;if(n)h+='<div class="hint" style="align-items:center"><span style="flex:1">'+n+' open rock'+(n>1?'s':'')+' &amp; projects here are not in '+esc(nx)+' yet.</span><button class="btn sm pri" onclick="askCarry(\''+esc(q)+'\',\''+esc(nx)+'\')">Carry to '+esc(nx)+' as projects</button></div>';}
  if(pv){var m=uncarried(pv,q).length;if(m)h+='<div class="hint" style="align-items:center"><span style="flex:1">'+m+' open rock'+(m>1?'s':'')+' &amp; projects from '+esc(pv)+' have not been brought into this quarter.</span><button class="btn sm pri" onclick="askCarry(\''+esc(pv)+'\',\''+esc(q)+'\')">Bring them in as projects</button></div>';}
  return h;}
function nextQuarterName(s){var m=/Q([1-4])\s*(\d{4})/.exec(s||'');if(!m)return '';var q=+m[1],y=+m[2];q++;if(q>4){q=1;y++;}return 'Q'+q+' '+y;}

  document.addEventListener('mouseup',function(){if(_subDrag===null&&!_todoDrag)_subArm=false;});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushSave();});
  setInterval(function(){
    if(!SB_ENABLED||!_auth||_saveTimer||_pushing||isEditing())return;
    if(isPending()){pushMergedSave();return;}                       // unsynced edits (e.g. earlier failure) -> retry
    /* cheap check first: only download the workbook when the server's timestamp moved */
    var probe=(_tsSupported&&_remoteTs)?sbFetch(SB_URL+'/rest/v1/'+SB_TABLE+'?id=eq.'+encodeURIComponent(SB_ID)+'&select=updated_at',{cache:'no-store'})
      .then(function(r){if(!r.ok)return {ok:false};return r.json().then(function(j){return {ok:true,same:!!(j&&j[0]&&j[0].updated_at===_remoteTs)};});}).catch(function(){return {ok:false};}):Promise.resolve({ok:true,same:false});
    probe.then(function(pr){
      if(!pr.ok)return {ok:false};if(pr.same)return {ok:true,unchanged:true};return loadSupabase();
    }).then(function(res){
      if(!res.ok){setSync('err','Offline — retrying');return;}
      if(res.unchanged){if(_lastErr){_lastErr=false;setSync('ok');}return;}
      if(!res.data)return;
      if(_lastErr){_lastErr=false;setSync('ok');}
      if(sig(res.data)===_lastRemoteSig)return;
      if(_saveTimer||_pushing||isEditing())return;                  // user started editing meanwhile; next tick
      try{if(!absorbRemote(res))return;}catch(e){console.error('[rocks] merge failed',e);return;}
      try{localStorage.setItem(STORE,JSON.stringify(WB));}catch(e){}
      renderQuarterSel();render(CUR);setSync('ok');
    });
  },4000);
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#search').focus();}if(e.key==='Escape'){$('#search').value='';if(CUR==='__search')switchTab('overview');closeModal('modal-settings');closeModal('modal-confirm');_txtCb=null;closeModal('modal-text');closeModal('modal-who');closeModal('modal-blk');}});

  // load local cache first (migrates legacy single-workbook format into a quarter)
  var localWB=null;
  try{var raw=localStorage.getItem(STORE);if(raw)localWB=toWB(JSON.parse(raw));}catch(e){}
  if(localWB)setWB(localWB);
  var hadLocal=wbHasData(WB);
  var hadPending=hadLocal&&isPending();
  var storedBase=loadStoredBase();
  if(!D)seed();
  _booted=true;
  renderQuarterSel();
  var _seenW=null;try{_seenW=localStorage.getItem('dc_welcomed');localStorage.setItem('dc_welcomed','1');}catch(e){}
  switchTab(_seenW?'overview':'welcome');

  // remote (source of truth) — only once signed in
  var hashType=consumeAuthHash();
  if(_auth&&hashType==='recovery'){_authView='newpass';_afterSignIn=bootRemote;showAuth();}
  else if(_auth){renderAuthBadge();bootRemote();}
  else{_afterSignIn=bootRemote;showAuth();}
 function bootRemote(){
  setSync('load','Syncing…');
  loadSupabase().then(function(res){
    var rwb=res.ok?toWB(res.data):null;
    var needPush=false;
    if(res.ok&&rwb&&wbHasData(rwb)){
      if(hadPending){                                                // edits from last visit never reached the server -> merge them in
        BASE=storedBase?clone(storedBase):null;
        try{absorbRemote(res);needPush=true;}catch(e){console.error('[rocks] merge failed',e);setWB(rwb);setBase(res.data,res.ts);}
      }else{ setWB(rwb);setBase(res.data,res.ts);_lastRemoteSig=sig(res.data); }
      setSync('ok');
    }
    else if(res.ok){ _remoteTs=null; setSync('err','No data — check your access'); }   // signed in but nothing visible: never seed/overwrite
    else { setSync('err'); }                                         // network error -> keep what we have
    var scAdded=ensureScorecard();                                   // load team scorecard if backend has none yet
    var bAdded=importBuildRocksQ2();                                 // one-time append of Build Q2 rocks from ClickUp
    ensureTodos();var tAdded=importTodos();if(res.ok&&ensureDueTodos(currentWeekStart())+ensureDueTodos(addDaysIso(currentWeekStart(),7)))tAdded=true;                          // one-time append of weekly to-dos
    renderQuarterSel();render(CUR);
    if(res.ok)setTimeout(maybeAskWho,300);
    if((scAdded||bAdded||tAdded||needPush)&&res.ok&&res.data)save();  // persist imported / recovered data once
  });
 }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
